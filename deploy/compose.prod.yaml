services:
  odoo-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD in .env}
    volumes:
      - odoo-db-data-v16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  odoo:
    image: odoo:20.0
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD in .env}
      RIOCLARO_SCREENING_FUNCTION_KEY: ${RIOCLARO_SCREENING_FUNCTION_KEY:-}
      RIOCLARO_DOCUMENT_INTELLIGENCE_ENDPOINT: ${RIOCLARO_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      RIOCLARO_DOCUMENT_INTELLIGENCE_KEY: ${RIOCLARO_DOCUMENT_INTELLIGENCE_KEY:-}
      RIOCLARO_TELEGRAM_BOT_TOKEN: ${RIOCLARO_TELEGRAM_BOT_TOKEN:-}
      RIOCLARO_TELEGRAM_WEBHOOK_SECRET: ${RIOCLARO_TELEGRAM_WEBHOOK_SECRET:-}
      RIOCLARO_AOAI_ENDPOINT: ${RIOCLARO_AOAI_ENDPOINT:-}
      RIOCLARO_AOAI_API_KEY: ${RIOCLARO_AOAI_API_KEY:-}
      RIOCLARO_AOAI_DEPLOYMENT: ${RIOCLARO_AOAI_DEPLOYMENT:-}
      RIOCLARO_SPEECH_ENDPOINT: ${RIOCLARO_SPEECH_ENDPOINT:-}
      RIOCLARO_SPEECH_REGION: ${RIOCLARO_SPEECH_REGION:-}
      RIOCLARO_SPEECH_KEY: ${RIOCLARO_SPEECH_KEY:-}
    # No published ports: only Caddy reaches Odoo, over the internal network.
    expose:
      - "8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo.prod.conf:/etc/odoo/odoo.conf:ro
      - ../custom_addons:/mnt/extra-addons:ro
    command:
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/usr/lib/python3/dist-packages/addons,/mnt/extra-addons

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - odoo
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  odoo-db-data-v16:
  odoo-data:
  caddy-data:
  caddy-config:
