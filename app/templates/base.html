<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Revisión de facturas{% endblock %} - Río Claro</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; color: #17202a; }
      nav { display: flex; gap: 1rem; margin-bottom: 2rem; }
      label { display: block; margin-top: 1rem; font-weight: 600; }
      input, select, button { font: inherit; padding: .5rem; margin-top: .25rem; }
      input { display: block; max-width: 24rem; width: 100%; }
      table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
      th, td { border-bottom: 1px solid #ccd1d1; padding: .6rem; text-align: left; }
      .errors { background: #fdecea; color: #922b21; padding: 1rem; }
      .notice { background: #fef9e7; padding: .75rem; }
      .actions { margin-top: 1.5rem; }
    </style>
  </head>
  <body>
    <nav>
      <a href="{{ url_for('invoice_list') }}">Facturas</a>
      <a href="{{ url_for('invoice_new') }}">Registrar factura</a>
    </nav>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
