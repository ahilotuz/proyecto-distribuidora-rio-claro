services:
  odoo-db:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD in .env}
    volumes:
      - odoo-db-data-v16:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  odoo:
    image: odoo:20.0
    restart: "no"
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      PORT: "5432"
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Set ODOO_DB_PASSWORD in .env}
      RIOCLARO_SCREENING_FUNCTION_KEY: ${RIOCLARO_SCREENING_FUNCTION_KEY:-}
      RIOCLARO_DOCUMENT_INTELLIGENCE_ENDPOINT: ${RIOCLARO_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      RIOCLARO_DOCUMENT_INTELLIGENCE_KEY: ${RIOCLARO_DOCUMENT_INTELLIGENCE_KEY:-}
      RIOCLARO_TELEGRAM_BOT_TOKEN: ${RIOCLARO_TELEGRAM_BOT_TOKEN:-}
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:-8069}:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./custom_addons:/mnt/extra-addons:ro
    command:
      - --addons-path=/usr/lib/python3/dist-packages/odoo/addons,/usr/lib/python3/dist-packages/addons,/mnt/extra-addons

volumes:
  odoo-db-data-v16:
  odoo-data:
